services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-cambia_esto_por_una_clave_larga}
      - ALLOWED_HOSTS=api.ipvu.itseprueba.com.ar
      - CSRF_TRUSTED_ORIGINS=https://api.ipvu.itseprueba.com.ar

  client:
    build:
      context: ./client
    restart: unless-stopped
      
