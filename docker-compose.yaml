services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_API
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-02437def0cc60f5a1c88d9de010aa4af5319ab88afdcd0b1c0331f7b089e361c}
      - ALLOWED_HOSTS=api-ipvu.itseprueba.com.ar
      - USAR_HTTPS=True
      - CORS_ALLOWED_ORIGINS=https://ipvu.itseprueba.com.ar

    client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://api-ipvu.itseprueba.com.ar
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_CLIENT
